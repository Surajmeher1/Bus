<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Radar / GPS Pulse Rings -->
  <circle cx="256" cy="110" r="48" fill="none" stroke="#60a5fa" stroke-width="6" opacity="0.4"/>
  <circle cx="256" cy="110" r="76" fill="none" stroke="#93c5fd" stroke-width="4" opacity="0.2"/>
  <circle cx="256" cy="110" r="14" fill="#38bdf8"/>

  <!-- Bus Body Container with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Main Chassis -->
    <rect x="116" y="150" width="280" height="230" rx="36" fill="url(#busGrad)"/>

    <!-- Windshield -->
    <rect x="142" y="174" width="228" height="88" rx="16" fill="#0f172a"/>
    <path d="M 148 180 L 220 180 L 190 256 L 148 256 Z" fill="#38bdf8" opacity="0.3"/>

    <!-- Destination Sign Header -->
    <rect x="176" y="156" width="160" height="12" rx="4" fill="#2563eb"/>

    <!-- Headlights -->
    <circle cx="160" cy="316" r="18" fill="#fbbf24"/>
    <circle cx="160" cy="316" r="10" fill="#fffbeb"/>
    <circle cx="352" cy="316" r="18" fill="#fbbf24"/>
    <circle cx="352" cy="316" r="10" fill="#fffbeb"/>

    <!-- Grille Bars -->
    <rect x="206" y="306" width="100" height="8" rx="4" fill="#64748b"/>
    <rect x="216" y="322" width="80" height="8" rx="4" fill="#64748b"/>

    <!-- Bumper -->
    <rect x="132" y="356" width="248" height="22" rx="10" fill="#334155"/>
  </g>

  <!-- Wheels -->
  <rect x="144" y="370" width="48" height="34" rx="10" fill="#0f172a"/>
  <rect x="320" y="370" width="48" height="34" rx="10" fill="#0f172a"/>
  <circle cx="168" cy="388" r="8" fill="#94a3b8"/>
  <circle cx="344" cy="388" r="8" fill="#94a3b8"/>

  <!-- University Monogram Emblem -->
  <circle cx="256" cy="282" r="14" fill="#2563eb"/>
  <text x="256" y="287" font-family="Arial, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">G</text>
</svg>
