services:
  - type: web
    name: giet-smart-bus-tracker
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: APP_URL
        value: https://giet-smart-bus-tracker.onrender.com
      - key: CLIENT_URL
        value: https://giet-smart-bus-tracker.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: Admin@123
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: surajmeher886@gmail.com
      - key: BREVO_SENDER_NAME
        value: GIET Smart Bus System
