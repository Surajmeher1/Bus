services:
  - type: web
    name: smart-bus-tracker
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.5.0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: Admin@123
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: mishrashreeshashish@gmail.com
      - key: SMTP_PASSWORD
        value: wosd hsfq mnef zthn
      - key: SMTP_FROM
        value: '"GIET Smart Bus System" <mishrashreeshashish@gmail.com>'
